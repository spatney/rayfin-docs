name: Documentation issue
description: Something on the docs site is wrong, unclear, or missing.
title: 'Docs: '
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page, or the source file under `content/docs/`.
      placeholder: https://rayfin.ai/docs/data/querying
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: |
        If something is inaccurate, say what the docs claim and what actually happens.
        Pasting the command you ran and its output is the fastest way to get this fixed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Rayfin version
      description: Output of `npx rayfin --version`, if the issue involves the CLI or SDK.
      placeholder: '1.34.0'
    validations:
      required: false
