name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # Static Web Apps needs full history for PR preview environments.
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint content
        run: npm run check:docs

      # Builds the static export and emits the agent surface: .md mirrors,
      # llms.txt, llms-full.txt, AGENTS.md, sitemap.xml, robots.txt and the
      # per-host header config.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://rayfin.ai' }}
          # Optional. Unset means no analytics script is emitted at all, which is
          # what forks and preview builds should do.
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}

      # After the build, which generates next-env.d.ts and .next/types — those
      # provide the PageProps/LayoutProps/RouteContext globals and the image
      # module declarations, and neither exists on a fresh clone.
      - name: Typecheck
        run: npm run typecheck

      - name: Verify agent surface
        run: npm run verify:agent

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The site is prebuilt above so that the post-build agent assets are
          # included; Oryx must not try to build it again.
          skip_app_build: true
          skip_api_build: true
          app_location: out
          output_location: ''

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
