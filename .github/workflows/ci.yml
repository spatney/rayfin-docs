name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Content contract: frontmatter, code fences, component allowlist, internal links.
      - name: Lint content
        run: npm run check:docs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The gate that matters: every rendered page must have a valid .md mirror.
      - name: Verify agent surface
        run: npm run verify:agent

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7
