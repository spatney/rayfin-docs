# Rayfin Docker Compose Configuration
# WEBSERVICE-IMAGE-NAME: {{WEBSERVICE_IMAGE_NAME}}
#
# This file is automatically copied to rayfin/.temp/ by the Rayfin CLI.
# DO NOT EDIT this file directly - changes will be overwritten on CLI version updates.
#
# USAGE:
# - Start all services: docker-compose up -d
# - Start specific profiles: docker-compose --profile data-api-mssql --profile storage up -d
#
# ADVANCED: Override Services with COMPOSE_FILE
# - Set COMPOSE_FILE environment variable to add additional compose files for overlaying
# - Example: COMPOSE_FILE=docker-compose.override.yml rayfin dev
#
# CREDENTIALS:
# Database passwords are read from environment variables (no defaults in this file).
# See .env.example for the full list of variables and their default values.
# The Rayfin CLI generates a .env file automatically via `rayfin dev`.
#
# ENVIRONMENT VARIABLES (optional - customize ports if needed):
#   RAYFIN_POSTGRES_PORT     - PostgreSQL host port (default: 5432)
#   RAYFIN_SQLSERVER_PORT    - SQL Server host port (default: 1433)
#   RAYFIN_POSTGRES_DATAAPI_PORT - PostgreSQL Data API port (default: 5433)
#   RAYFIN_AZURITE_BLOB_PORT - Azurite blob service port (default: 10000)
#   RAYFIN_AZURITE_QUEUE_PORT - Azurite queue service port (default: 10001)
#   RAYFIN_AZURITE_TABLE_PORT - Azurite table service port (default: 10002)
#   RAYFIN_MAILDEV_SMTP_PORT - MailDev SMTP port (default: 1025)
#   RAYFIN_MAILDEV_WEB_PORT  - MailDev Web UI port (default: 1080)
#
# Example - Use custom ports:
#   $env:RAYFIN_POSTGRES_PORT = "5433"
#   $env:RAYFIN_SQLSERVER_PORT = "1434"
#   docker-compose --profile data-api-mssql up -d
#
# PROFILES:
# - data-api-mssql: SQL Server database (required for data service with dialect=mssql)
# - data-api-postgresql: PostgreSQL database (required for data service with dialect=postgresql)
# - storage: Azurite storage emulator (required for storage service)
# - email: MailDev email testing server (required for email verification/password reset)
# - telemetry: Aspire Dashboard for observability (optional)
#
# IMPORTANT: To stop all containers:
# docker-compose down
#
# Container names and hostnames:
# - rayfin-webservice (hostname: webservice): The main .NET WebService (always started)
# - rayfin-postgres (hostname: postgres): PostgreSQL database for control plane (always started)
# - rayfin-maildev (hostname: maildev): MailDev SMTP server for email testing (profile: email)
# - rayfin-sqlserver (hostname: sqlserver): SQL Server database for Data API (profile: data)
# - rayfin-azurite (hostname: azurite): Azurite Storage Emulator (profile: storage)
# - rayfin-aspire-dashboard (hostname: aspire-dashboard): .NET Aspire Dashboard (profile: telemetry)
#
# MULTI-PROJECT SUPPORT:
# Container names are auto-generated by Docker Compose based on project name to prevent conflicts.
# Host ports are dynamically allocated by 'rayfin dev' and stored in rayfin/.temp/.env
#
# Hostnames (for inter-container communication):
# - webservice: The main .NET WebService (always started)
# - postgres: PostgreSQL database (always started)
# - maildev: MailDev SMTP server (profile: email)
# - sqlserver: SQL Server database (profile: data-api-mssql)
# - postgres-dataapi: PostgreSQL database (profile: data-api-postgresql)
# - azurite: Azurite Storage Emulator (profile: storage)
# - aspire-dashboard: .NET Aspire Dashboard (profile: telemetry)
#
# Network references between containers:
# All containers are on the default Docker Compose network (auto-named per project)
# - From webservice to Control Plane PostgreSQL: "admin-db"
# - From webservice to MailDev: "maildev"
# - From webservice to SQL Server: "sqlserver"
# - From webservice to PostgreSQL Data API: "postgres-dataapi"

# - From any container to Azurite: "azurite"
#
# Dynamic port allocation (configured via environment variables in rayfin/.temp/.env):
# All ports have default values to prevent Docker Compose warnings:
# - Webservice: ${RAYFIN_WEBSERVICE_HTTP_PORT:-5168}:8080 and ${RAYFIN_WEBSERVICE_HTTPS_PORT:-7126}:443
# - PostgreSQL: ${RAYFIN_POSTGRES_PORT:-5432}:5432
# - MailDev SMTP: ${RAYFIN_MAILDEV_SMTP_PORT:-1025}:1025 (profile: email)
# - MailDev Web UI: ${RAYFIN_MAILDEV_WEB_PORT:-1080}:1080 (profile: email)
# - SQL Server: ${RAYFIN_SQLSERVER_PORT:-1433}:1433 (profile: data-api-mssql)
# - PostgreSQL Data API: ${RAYFIN_POSTGRES_DATAAPI_PORT:-5433}:5432 (profile: data-api-postgresql)
# - Azurite: ${RAYFIN_AZURITE_BLOB_PORT:-10000}:10000, ${RAYFIN_AZURITE_QUEUE_PORT:-10001}:10001, ${RAYFIN_AZURITE_TABLE_PORT:-10002}:10002 (profile: storage)
# - Aspire Dashboard: ${RAYFIN_ASPIRE_UI_PORT:-18888}:18888, ${RAYFIN_ASPIRE_OTLP_PORT:-4317}:18889 (profile: telemetry)

services:
  webservice:
    hostname: webservice
    image: {{WEBSERVICE_IMAGE_NAME}}
    pull_policy: always
    platform: linux/amd64
    ports:
      - "${RAYFIN_WEBSERVICE_HTTP_PORT:-5168}:8080"
      - "${RAYFIN_WEBSERVICE_HTTPS_PORT:-7126}:443"
    environment:
      # ASP.NET Core environment
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=admin-db;Database=RayfinDB;Username=postgres;Password=${RAYFIN_POSTGRES_PASSWORD};
      - ConnectionStrings__ProjectDBConnection_MsSql=Server=sqlserver;Database=RayfinProjectDB;User Id=sa;Password=${RAYFIN_SQLSERVER_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__ProjectDBConnection_PostgreSql=Host=postgres-dataapi;Database=RayfinProjectDB;Username=postgres;Password=${RAYFIN_POSTGRES_DATAAPI_PASSWORD};
      # Skip database creation if it already exists - prevents "Database already exists" errors when restarting containers
      - Database__SkipInitializationIfExists=true
      # Service enable/disable flags from .env file
      - Auth__Enabled=${Auth__Enabled:-false}
      - Data__Enabled=${Data__Enabled:-false}
      - Storage__Enabled=${Storage__Enabled:-false}
      # Asymmetric key provider configuration (for JWT signing)
      # Keys are managed via Auth__AsymmetricKeys__* environment variables
      - Auth__AsymmetricKeys__Provider=${Auth__AsymmetricKeys__Provider:-local-file}
      - Auth__AsymmetricKeys__Algorithm=${Auth__AsymmetricKeys__Algorithm:-ES256}
      - Auth__AsymmetricKeys__KeySize=${Auth__AsymmetricKeys__KeySize:-256}
      # Local file provider settings (used when Provider=local-file)
      - Auth__AsymmetricKeys__LocalFile__AutoGenerateKeys=${Auth__AsymmetricKeys__LocalFile__AutoGenerateKeys:-true}
      # Azure Key Vault provider settings (used when Provider=azure-keyvault)
      - Auth__AsymmetricKeys__AzureKeyVault__KeyVaultUrl=${Auth__AsymmetricKeys__AzureKeyVault__KeyVaultUrl:-}
      - Auth__AsymmetricKeys__AzureKeyVault__SigningCertificateName=${Auth__AsymmetricKeys__AzureKeyVault__SigningCertificateName:-rayfin-signing-cert}
      # Database retry configuration
      - Database__StartupRetryCount=9
      - Database__StartupRetryDelaySeconds=10
      # Storage configuration for Azurite
      - Storage__Provider=Azurite
      # Use the standard development storage connection string
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000;QueueEndpoint=http://azurite:10001;TableEndpoint=http://azurite:10002;
      # Note: Email configuration is runtime-driven via IProjectContext.ServiceSettings.Auth.Email
      # No bootstrap environment variables needed - all settings stored in database
      # Add HOME environment variable to help Azure CLI find credentials
      - HOME=/root
      # Azure Key Vault authentication (for production deployments)
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-dummy-tenant-id}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-dummy-client-id}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-dummy-client-secret}
    # Note: Dependencies removed to allow selective service deployment via profiles
    # The webservice has retry logic to handle delayed availability of optional services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "apt-get update && apt-get install -y curl && curl -f http://localhost:8080/healthcheck || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  admin-db:
    hostname: postgres
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    ports:
      - "${RAYFIN_POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${RAYFIN_POSTGRES_PASSWORD}
      - POSTGRES_DB=RayfinDB
    volumes:
      - admin-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  maildev:
    # MailDev for local email testing (SMTP server and Web UI)
    # Web UI: http://localhost:1080 (view sent emails)
    # SMTP: maildev:1025 (configure in environment variables)
    # Runs only with --profile email (required when Email:Enabled=true)
    profiles: ["email"]
    hostname: maildev
    image: maildev/maildev:latest@sha256:180ef51f65eefebb0e7122d8308813c1fd7bff164bc440ce5a3c2feee167a810
    # Restart on crash so a transient MailDev failure doesn't break the whole
    # E2E stage. MailDev has been observed to drop keep-alive sockets under
    # load; pairing this with client-side retries keeps the test suite stable.
    restart: unless-stopped
    ports:
      - "${RAYFIN_MAILDEV_SMTP_PORT:-1025}:1025" # SMTP server
      - "${RAYFIN_MAILDEV_WEB_PORT:-1080}:1080"  # Web UI
    environment:
      - MAILDEV_SMTP_PORT=1025
      - MAILDEV_WEB_PORT=1080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1080"]
      interval: 10s
      timeout: 5s
      retries: 3

  sqlserver:
    # SQL Server runs only with --profile data-api-mssql (required when Data:Enabled=true with dialect=mssql)
    hostname: sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:49b45a911dc535e9345fbfd7101a1bd8a1e190a5f29b877ef75387a061e5fcf0
    profiles: ["data-api-mssql"]
    ports:
      - "${RAYFIN_SQLSERVER_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${RAYFIN_SQLSERVER_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-dataapi-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -Q 'SELECT 1' -C",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  postgres-dataapi:
    # PostgreSQL Data API runs only with --profile data-api-postgresql (required when Data:Enabled=true with dialect=postgresql)
    hostname: postgres-dataapi
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    profiles: ["data-api-postgresql"]
    ports:
      - "${RAYFIN_POSTGRES_DATAAPI_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${RAYFIN_POSTGRES_DATAAPI_PASSWORD}
    volumes:
      - postgres-dataapi-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  azurite:
    hostname: azurite
    image: mcr.microsoft.com/azure-storage/azurite:latest@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    profiles: ["storage"]
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "${RAYFIN_AZURITE_BLOB_PORT:-10000}:10000" # blob
      - "${RAYFIN_AZURITE_QUEUE_PORT:-10001}:10001" # queue
      - "${RAYFIN_AZURITE_TABLE_PORT:-10002}:10002" # table
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw== # Default Azurite key (not a secret)
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc 127.0.0.1 10000 -z"]
      interval: 10s
      retries: 30

  aspire-dashboard:
    hostname: aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest@sha256:bc9fa3e3a05ea09da8fd5980c73e58eabf4df01fa126c09bddc79d9152280e2c
    profiles: ["telemetry"]
    pull_policy: always
    platform: linux/amd64
    ports:
      - "${RAYFIN_ASPIRE_UI_PORT:-18888}:18888" # Dashboard UI (default 18888)
      - "${RAYFIN_ASPIRE_OTLP_PORT:-4317}:18889" # OTLP gRPC endpoint (default 4317)
    environment:
      # Disable authentication for development use
      - ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - ASPNETCORE_ENVIRONMENT=Development
    healthcheck:
      # This is a very simple container. There is no health check endpoint
      disable: true

networks:
  default:
    driver: bridge

volumes:
  admin-data:
  postgres-dataapi-data:
  sqlserver-dataapi-data:
  azurite-data:
